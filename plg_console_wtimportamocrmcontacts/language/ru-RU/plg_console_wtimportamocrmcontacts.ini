PLG_WTIMPORTAMOCRMCONTACTS="Консоль - WT import AmoCRM contacts"
PLG_WTIMPORTAMOCRMCONTACTS_DESC="CLI-плагин для создания (импорта) пользователей Joomla из контактов AmoCRM."
PLG_WTIMPORTAMOCRMCONTACTS_HOWTO="<h4>Как использовать?</h4><p>Подключитесь к вашему серверу по SSH, перейдите в папку CLI вашего сайта и выполните команду <code>php joomla.php oldarticlesaliases:save</code>. В этом случае будут обработаны <strong class=\"text-danger\">все без исключения</strong> материалы на сайте.</p><p>Если добавить аргумент <code>test</code> - <code>php joomla.php oldarticlesaliases:save test</code> - тогда команда покажет, какие именно изменения будут внесены плагином, но сами изменения применяться не будут.</p><p>Чтобы обрабатывать материалы только из выбранных категорий, укажите <code>id</code> этих категорий в параметре <code>--cats</code> через запятую без пробелов. Например, <code>--cats=12,140,211</code>. Команда в этом случае будет выглядеть следующим образом <code>php joomla.php oldarticlesaliases:save --cats=12,140,211</code></p>"