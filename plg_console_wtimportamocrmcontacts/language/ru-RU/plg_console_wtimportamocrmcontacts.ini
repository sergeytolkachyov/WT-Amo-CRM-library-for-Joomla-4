PLG_WTIMPORTAMOCRMCONTACTS="Консоль - WT import AmoCRM contacts"
PLG_WTIMPORTAMOCRMCONTACTS_DESC="CLI-плагин для создания (импорта) пользователей Joomla из контактов AmoCRM."
PLG_WTIMPORTAMOCRMCONTACTS_HOWTO="<h4>Как использовать?</h4><p>Подключитесь к вашему серверу по SSH, перейдите в папку CLI вашего сайта и выполните команду <code>/path/to/php joomla.php  amocrm:&lt;entity&gt;:&lt;command&gt;</code>, где <code>&lt;entity&gt;</code> - сущность AmoCRM и <code>&lt;command&gt;</code> - команда для работы с ней.</p><p class=\"text-danger\">Для корректной работы CLI команд Joomla в <code>configuration.php</code> вашего сайта установите в параметре <code>$live_site=\"https://your-domain.ru/\"</code> - ваш домен обязательно со знаком слеша - <code>/</code> - на конце.</p>"
PLG_WTIMPORTAMOCRMCONTACTS_COMMAND="Доступные команды"
PLG_WTIMPORTAMOCRMCONTACTS_COMMAND_AMOCRM_TAGS_SHOW="amocrm:tags:show"
PLG_WTIMPORTAMOCRMCONTACTS_COMMAND_AMOCRM_TAGS_SHOW_DESC="<p>Команда <code>amocrm:tags:show</code> (<code>/usr/bin/php84 joomla.php amocrm:tags:show</code>, например) выводит в консоли табличку со списком тегов (id, название, цвет) для выбранной сущности. По умолчанию выводятся теги для сделок (<code>leads</code>).</p><h4>Опции команды</h4><p><ul><li><code>--entity</code> - (<code>php joomla.php amocrm:tags:show --entity=leads</code>) - укажите сущность AmoCRM, для которой нужно отобразить список тегов. Возможные значения: <code>leads</code>, <code>contacts</code>, <code>companies</code> или <code>customers</code>. <code>leads</code> по умолчанию.</li></ul></p>"
PLG_WTIMPORTAMOCRMCONTACTS_COMMAND_AMOCRM_CONTACTS_IMPORT="amocrm:contacts:import"
PLG_WTIMPORTAMOCRMCONTACTS_COMMAND_AMOCRM_CONTACTS_IMPORT_DESC="<p>Команда импортирует контакты AmoCRM в пользователей Joomla по REST API. Команда использует код и логику плагина <code>User - WT Amocrm user sync</code>, который должен быть включён и предварительно настроен.</p><h4>Опции команды</h4><p><ul><li><code>test</code> - (<code>/usr/bin/php84 joomla.php amocrm:contacts:import test</code>) - Предпросмотр списка из 5 контактов, отобранных по указаннам параметрам. Никаких действий более производиться не будет.</li><li><code>--notags</code> - (<code>/usr/bin/php84 joomla.php amocrm:contacts:import --notags=277163,45776</code>) - будут импортированы все контакты кроме тех, которым присвоены указанные теги. Посмотреть id тегов можно с помощью команды <code>amocrm:tags:show</code>.</li><li><code>--tags</code> - (<code>/usr/bin/php84 joomla.php amocrm:contacts:import --tags=1,14,543</code>) - будут импортированы контакты, которым присвоены указанные через запятую теги. Посмотреть id тегов можно с помощью команды <code>amocrm:tags:show</code>.</li></ul></p>"