PLG_WTIMPORTAMOCRMCONTACTS="Console - WT import AmoCRM contacts"
PLG_WTIMPORTAMOCRMCONTACTS_DESC="The plugin updates the aliases of Joomla articles by adding the article id to them, according to the old Joomla routing rules. This will allow you to save the old URLs of the articles and at the same time transfer the site to a new router."
PLG_WTIMPORTAMOCRMCONTACTS_HOWTO="<h4>How to use?</h4><p>Connect to your server via SSH, navigate to your site's CLI folder, and run the <code>/path/to/php command joomla.php amocrm:&lt;entity&gt;:&lt;command&gt;</code>, where <code>&lt;entity&gt;</code> is the amoCRM entity and <code>&lt;command&gt;</code> is the command to work with it.</p><p class=\"text-danger\">For the correct operation of the Joomla CLI commands in <code>configuration.php</code> for your site, set the parameter to <code>$live_site=\"https://your-domain.ru /\"</code> - your domain must have a slash sign - <code>/</code> - at the end.</p>"
PLG_WTIMPORTAMOCRMCONTACTS_COMMAND="Available Commands"
PLG_WTIMPORTAMOCRMCONTACTS_COMMAND_AMOCRM_TAGS_SHOW="amocrm:tags:show"
PLG_WTIMPORTAMOCRMCONTACTS_COMMAND_AMOCRM_TAGS_SHOW_DESC="<p>The <code>amocrm command:tags:show</code> (<code>/usr/bin/php84 joomla.php amocrm:tags:show</code>, for example) displays a table in the console with a list of tags (id, name, color) for the selected entity. By default, tags for <code>leads</code> are displayed.</p><h4>Command options</h4><p><ul><li><code>--entity</code> - (<code>php joomla.php amocrm:tags:show --entity=leads</code>) - specify the amoCRM entity for which you want to display a list of tags. Possible values: <code>leads</code>, <code>contacts</code>, <code>companies</code> or <code>customers</code>. <code>leads</code> by default.</li></ul></p>"
PLG_WTIMPORTAMOCRMCONTACTS_COMMAND_AMOCRM_CONTACTS_IMPORT="amocrm:contacts:import"
PLG_WTIMPORTAMOCRMCONTACTS_COMMAND_AMOCRM_CONTACTS_IMPORT_DESC="<p>This command imports amoCRM contacts to Joomla users via the REST API. The command uses the code and logic of the <code>User - WT Amocrm user sync</code> plugin, which must be enabled and pre-configured.</p><h4>Command options</h4><p><ul><li><code>test</code> - (<code>/usr/bin/php84 joomla.php amocrm:contacts:import test</code>) - Preview a list of 5 contacts selected according to the specified parameters. No further actions will be performed.</li><li><code>--notags</code> - (<code>/usr/bin/php84 joomla.php amocrm:contacts:import --notags=277163,45776</code>) - all contacts except those assigned the specified tags will be imported. You can view the tag IDs using the <code>amocrm:tags:show</code> command.</li><li><code>--tags</code> - (<code>/usr/bin/php84 joomla.php amocrm:contacts:import --tags=1,14,543</code>) - contacts that have comma-separated tags will be imported. You can view the tag IDs using the <code>amocrm:tags:show</code> command.</li></ul></p>"