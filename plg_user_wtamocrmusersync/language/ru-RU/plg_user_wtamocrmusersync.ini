PLG_WTAMOCRMUSERSYNC_JOOMLA_USER_HAS_BEEN_REMOVED = "Аккаунт этого контакта на сайте Joomla был удалён %s"
PLG_WTAMOCRMUSERSYNC_CYCLICAL_REQUESTS_RISK="Риск циклических запросов к API. Возможна блокировка REST API в аккаунте AmoCRM."
PLG_WTAMOCRMUSERSYNC_CYCLICAL_REQUESTS_RISK_DESC="<p>Вы включили одновременно обновление данных контакта в AmoCRM при обновлении в Joomla, а также обработку входящих вебхуков и изменение данных пользователей Joomla при обновлении в AmoCRM.</p><p>В этом режиме одна сторона интеграции (Joomla или AmoCRM) сообщит другой об изменении данных. Вторая сторона обновит данные и после этого сообщит первой стороне о том, что данные были обновлены. Первая сторона снова изменит данные и снова сообщит об этом второй стороне и так далее по кругу. Такое взаимное уведомление будет длиться до окончания лимита времени исполнения PHP-скрипта, обычно это 60 секунд.</p><p class=\"fw-bold\">Подобные ситуации ведут к превышению лимитов на количество запросов к REST API AmoCRM и полной блокировке REST API в аккаунте, что может повлиять на работу других интеграций.</p>"
PLG_WTAMOCRMUSERSYNC_AMOCRM_CONTACT_JOOMLA_PROFILE_LINK_FIELD_ID="Поле для ссылки пользователя Joomla"
PLG_WTAMOCRMUSERSYNC_AMOCRM_CONTACT_JOOMLA_PROFILE_LINK_FIELD_ID_DESC="Для контакта AmoCRM можно создать поле типа <code>ссылка</code>, в которой будет храниться ссылка на пользователя Joomla для контакта AmoCRM. Удобно использовать для быстрого перехода между интерфейсами Joomla и AmoCRM."
