; AmoCRM webhook fieldset
PLG_WTAMOCRMUSERSYNC_WEBHOOK_FIELDSET_LABEL = "Вебхуки AmoCRM"
PLG_WTAMOCRMUSERSYNC_WEBHOOK_FIELDSET_DESC = "Вебхуки - исходящие из AmoCRM запросы к вашему сайту Joomla, которые отправляются во время определённых событий в AmoCRM: создание контакта, создание компании, удаление сделки и т.д. Здесь вы можете разрешить выполнять действия с пользователями Joomla при работе со связанными с ними контактами в AmoCRM."
PLG_WTAMOCRMUSERSYNC_AMOCRM_TO_JOOMLA_NOTE = "Источник данных: AmoCRM. Приёмник данных: Joomla"
PLG_WTAMOCRMUSERSYNC_ALLOW_WEBHOOK_ACTIONS = "Разрешить обработку вебхуков?"
PLG_WTAMOCRMUSERSYNC_ALLOW_WEBHOOK_ACTIONS_DESC = "Вам будут доступны дополнительные настройки для управления пользователями Joomla при работе с соответствующими им контактами в AmoCRM. Для корректной работы должна быть настроено соответствие между пользователями Joomla и контактами AmoCRM"
PLG_WTAMOCRMUSERSYNC_ALLOW_CREATE_USER = "Разрешить <code>создание</code> пользователей?"
PLG_WTAMOCRMUSERSYNC_ALLOW_CREATE_USER_DESC = "При создании контакта в AmoCRM будет создан пользователь Joomla. Используются параметры компонента пользователей."
PLG_WTAMOCRMUSERSYNC_ALLOW_UPDATE_USER_DATA = "Разрешить <code>изменение данных</code> пользователей?"
PLG_WTAMOCRMUSERSYNC_ALLOW_UPDATE_USER_DATA_DESC = "При изменении контактов в AmoCRM будут изменяться данные связанных пользователей в Joomla."
PLG_WTAMOCRMUSERSYNC_UPDATE_USER_EMAIL="<span class=\"badge bg-warning\"><i class=\"fa-solid fa-triangle-exclamation\"></i></span> Изменять основной e-mail пользователя?"
PLG_WTAMOCRMUSERSYNC_UPDATE_USER_EMAIL_DESC="<p>Если да, то при изменении связанного контакта в AmoCRM будет изменяться основной e-mail пользователя Joomla. <strong>Будьте внимательны</strong>, на новый email будут приходить все письма Joomla, в том числе с восстановлением пароля, уведомления и т.д.</p><p>Если в AmoCRM для контакта указаны <strong>несколько e-mail</strong>, то использоваться будет <strong>первый из них</strong>.</p>"
PLG_WTAMOCRMUSERSYNC_ALLOW_DELETE_USER_DATA = "Разрешить <code>удаление</code> пользователей?"
PLG_WTAMOCRMUSERSYNC_ALLOW_DELETE_USER_DATA_DESC = "При удалении контакта в AmoCRM будет удалён связанный с ним пользователь Joomla."
; Creating users fieldset
PLG_WTAMOCRMUSERSYNC_CREATE_USERS_RULES_FIELDSET_LABEL="Создание пользователей"
PLG_WTAMOCRMUSERSYNC_CREATE_USERS_RULES_FIELDSET_DESC="Расширенные настройки создания пользователей по вебхуку из AmoCRM. Включите параметр <code>Разрешить создание пользователей?</code> в табе <code>Вебхуки AmoCRM</code>."
PLG_WTAMOCRMUSERSYNC_DEFAULT_USER_GROUP="Группа пользователей по умолчанию"
PLG_WTAMOCRMUSERSYNC_DEFAULT_USER_GROUP_DESC="Новые пользователи будут принадлежать выбранной группе пользователей"
PLG_WTAMOCRMUSERSYNC_AUTO_ENABLE_NEW_USER="Автоматически <code>включать</code> нового пользователя?"
PLG_WTAMOCRMUSERSYNC_AUTO_ENABLE_NEW_USER_DESC="<p>Созданный пользователь не будет заблокирован и сможет войти в свой аккаунт самостоятельно.</p><p>При включённом параметре автоматической активации учитываются параметры регистрации из настроек компонента <code>Пользователи</code> (<code>com_users</code>). Если в них включена активация пользователя администратором или самостоятельно, то данная настройка переопределяется параметрами компонента. Если в компоненте <code>Пользователи</code> отключён параметр <code>Активация пользователя</code>, то данная настройка будет учитываться.</p>"
PLG_WTAMOCRMUSERSYNC_NOTIFY_NEW_USER="Активация и уведомление нового пользователя о создании аккаунта? (e-mail)"
PLG_WTAMOCRMUSERSYNC_NOTIFY_NEW_USER_DESC="<p>Если <code>да</code>, то новый пользователь получит уведомление Joomla о созданном аккаунте. Также ему, возможно, потребуется подтвердить свой e-mail.</p><p>При включённом параметре учитываются параметры регистрации из настроек компонента <code>Пользователи</code> (<code>com_users</code>).</p>"
PLG_WTAMOCRMUSERSYNC_WEBHOOK_NOTIFY_AMOCRM_NEW_USER_FROM_WEBHOOK_SUCCESSFULLY_CREATED="Для контакта успешно создан пользователь id %s на сайте %s."
PLG_WTAMOCRMUSERSYNC_PROCESS_CONTACTS_DUPLICATES="Обработка дублей контактов"
PLG_WTAMOCRMUSERSYNC_PROCESS_CONTACTS_DUPLICATES_DESC="<p>В процессе создания пользователей Joomla из контактов AmoCRM производится предварительный поиск дублей по <code>e-mail</code>.</p><ul><li>Если пользователь Joomla с данным e-mail уже существует, но не имеет связи с контактом AmoCRM - контакт будет связан с ним.</li><li>Если контактов с дублирующимися окажется несколько - id контактов AmoCRM будут сохранены в файл отчёта для дальнейшего разрешения конфликта вручную, а с пользователем Joomla будет связан только первый контакт AmoCRM.</li></ul>"
PLG_WTAMOCRMUSERSYNC_WEBHOOK_NOTIFY_AMOCRM_NEW_USER_FROM_WEBHOOK_SUCCESSFULLY_LINKED="Данный контакт успешно ассоциирован с существующим пользователем id %s на сайте %s."
PLG_WTAMOCRMUSERSYNC_WEBHOOK_NOTIFY_AMOCRM_NEW_USER_FROM_WEBHOOK_DUPLICATES_FOUND="При создании аккаунта на сайте %s для контакта было найдено несколько разных пользователей с e-mail, указанными в данном контакте: %s. В связи с этим невозможно выполнить привязку в автоматическом режиме."
PLG_WTAMOCRMUSERSYNC_WEBHOOK_NOTIFY_AMOCRM_NEW_USER_FROM_WEBHOOK_SINGLE_DUPLICATE_PREVIOUS_ASSOCIATION_FOUND="При создании аккаунта на сайте %s для e-mail %s данного контакта (id:%s) был найден уже созданный ранее пользователь id:%s, ассоциированный с контактом AmoCRM id:%s. В связи с этим невозможно выполнить привязку в автоматическом режиме."
PLG_WTAMOCRMUSERSYNC_TEMPORARY_USERS_DESCRIPTION_LABEL="Временные пользователи"
PLG_WTAMOCRMUSERSYNC_TEMPORARY_USERS_DESCRIPTION_DESC="<p>Обязательным для Joomla при создании пользователя является наличие e-mail. В случаях, когда пользователи создаются не типичным для Joomla путём (программно с помощью интеграций или сторонних решений регистрации), у пользователей может не быть всех необходимых для создания аккаунта данных. Например, указан только телефон или id социальной сети.</p><p>Поэтому для пользователя указывается временная почта вида: <code>change-this-fake-email-amocrm-[$amocrm_contact_id]@[адрес_вашего_сайта]</code>. Таким же устанавливается и логин пользователя. В таблице связей пользователей Joomla и контактов AmoCRM устанавливается логический флаг <code>is_temporary_user=1</code>. В дальнейшем по этому флагу и по временному логину/email вы можете в своей интеграции / своём плагине выделить пользователей со статусом \"временный\" и перенаправить его на до-заполнение данных.</p>"
PLG_WTAMOCRMUSERSYNC_FORCE_TEMPORARY_USER_STATUS_WHEN_CREATE="Принудительно устанавливать статус <code>временного</code> пользователя?"
PLG_WTAMOCRMUSERSYNC_FORCE_TEMPORARY_USER_STATUS_WHEN_CREATE_DESC="Для всех пользователей, независимо от полноты имеющихся данных будет установлен статус временного. При дальнейшем перенаправлении пользователя на до-заполнение данных вы сможете запросить у него актуализацию данных. <strong>Это может быть удобно при создании пользователей через вебхуки или через CLI импорт. В случае самостоятельной регистрации пользователей или ручном создании, возможно, этот параметр стоит отключить.</strong>"
; Fields mapping fieldset
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_FIELDSET_LABEL="Сопоставление полей (вебхук)"
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_FIELDSET_DESC="<p>Настройте сопоставление полей контакта AmoCRM и пользователя Joomla. Вы можете хранить данные полей в свойстве <code>params</code> объекта пользователя (для разработчиков) или в пользовательских полях.</p><p>Эти настройки так же используются плагином CLI-импорта контактов из AmoCRM <code>Console - WT Import AmoCRM contacts</code>.</p>"
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING="Сопоставление полей пользователя Joomla и контакта AmoCRM"
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_FIELDS_MAPPING_JOOMLA_FIELD="Тип хранилища"
