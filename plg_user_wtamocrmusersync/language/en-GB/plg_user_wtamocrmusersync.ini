PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_FIELDS_JOOMLA_SIDE_USER_PARAMS_PARAM_NAME="Param name"
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_FIELDS_JOOMLA_SIDE_USER_PARAMS_PARAM_NAME_DESC="The value will be available as <code>$user['params']['amocrm']['param_name']</code>"
