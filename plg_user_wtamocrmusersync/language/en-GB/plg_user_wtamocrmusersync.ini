PLG_WTAMOCRMUSERSYNC = "User - WT AmoCRM user sync"
PLG_WTAMOCRMUSERSYNC_DESC = "A plugin for synchronizing Joomla users and AmoCRM contacts."
; Basic fieldset
PLG_WTAMOCRMUSERSYNC_JOOMLA_TO_AMOCRM_NOTE = "Data-source: Joomla. Data-receiver: AmoCRM"
PLG_WTAMOCRMUSERSYNC_AMOCRM_CONTACT_TAGS_LABEL = "Contact tags"
PLG_WTAMOCRMUSERSYNC_AMOCRM_CONTACT_TAGS_DESC = "Assign selected tags to contacts. Only for new users."
PLG_WTAMOCRMUSERSYNC_JOOMLA_USER_HAS_BEEN_REMOVED = "This contact's account on the Joomla website has been deleted at %s"
PLG_WTAMOCRMUSERSYNC_UPDATE_AMOCRM_CONTACT_DATA_BY_JOOMLA = "Update AmoCRM contact data when user data has been changed in Joomla?"
PLG_WTAMOCRMUSERSYNC_UPDATE_AMOCRM_CONTACT_DATA_BY_JOOMLA_DESC = "If the Joomla user's data changes, should I update the data in amoCRM?"
PLG_WTAMOCRMUSERSYNC_CYCLICAL_REQUESTS_RISK="Risk of cyclical API requests. It is possible to block the REST API in the amoCRM account."
PLG_WTAMOCRMUSERSYNC_CYCLICAL_REQUESTS_RISK_DESC="<p>You have enabled simultaneous updating of contact data in amoCRM when updating in Joomla, as well as processing incoming webhooks and changing Joomla user data when updating in amoCRM.</p><p>In this mode, one side of the integration (Joomla or amoCRM) will inform the other about the data change. The second side of integration will update the data and then inform the first party that the data has been updated. The first party will change the data again and inform the second party about it again, and so on in a loop. Such mutual notification will last until the end of the PHP script execution time limit, which is usually 60 seconds.</p><p class=\"fw-bold\">Such situations lead to exceeding the limits on the number of requests to the amoCRM REST API and the complete blocking of the REST API in the account, which may affect the operation of other integrations.</p>"
PLG_WTAMOCRMUSERSYNC_CREATE_AMOCRM_CONTACT = "Create a contact in amoCRM?"
PLG_WTAMOCRMUSERSYNC_CREATE_AMOCRM_CONTACT_DESC = "When creating a Joomla user, a contact will be created in amoCRM"
PLG_WTAMOCRMUSERSYNC_ONUSERAFTERSAVE_NO_AMOCRM_CONTACT_ID_FOR_JOOMLA_USER_ID = "WT AmoCRM user sync plugin, onUserAfterSave: Joomla user with id %s haven't related AmoCRM contact id in database"
PLG_WTAMOCRMUSERSYNC_ONUSERAFTERSAVE_AMOCRM_CONTACT_HAS_BEEN_UPDATED = "WT AmoCRM user sync plugin, onUserAfterSave: AmoCRM user with id %s has been updated."
PLG_WTAMOCRMUSERSYNC_AMOCRM_CONTACT_JOOMLA_PROFILE_LINK_FIELD_ID="Joomla user link field"
PLG_WTAMOCRMUSERSYNC_AMOCRM_CONTACT_JOOMLA_PROFILE_LINK_FIELD_ID_DESC="For an amoCRM contact, you can create a field like <code>link</code>, which will store a link to the Joomla user for the amoCRM contact. It is convenient to use for a quick transition between the Joomla and amoCRM interfaces."
; AmoCRM webhookes fieldset
PLG_HWTAMOCRMUSERSYNC_WEBHOOK_FIELDSET_LABEL = "amoCRM Webhooks"
PLG_HWTAMOCRMUSYNC_WEBHOOK_FIELDSET_DESC = "Webhooks are requests originating from amoCRM to your Joomla site that are sent during certain events in amoCRM: creating a contact, creating a company, deleting a transaction, etc. Here you can allow actions to be performed with Joomla users when working with related contacts in amoCRM."
PLG_WTAMOCRMUSERSYNC_AMOCRM_TO_JOOMLA_NOTE = "Data-source: AmoCRM. Data-receiver: Joomla"
PLG_WTAMOCRMUSERSYNC_ALLOW_WEBHOOK_ACTIONS = "Allow webhook processing?"
PLG_WTAMOCRMUSERSYNC_ALLOW_WEBHOOK_ACTIONS_DESC = "You will have access to additional settings for managing Joomla users when working with their corresponding contacts in amoCRM. For correct operation, a match must be set up between Joomla users and amoCRM contacts"
PLG_HWTAMOCRMUSERSYNC_ALLOW_CREATE_USER = "Allow users <code>creation</code>?"
PLG_HWTAMOCRMUSYNC_ALLOW_CREATE_USER_DESC = "When creating a contact in amoCRM, a Joomla user will be created. The parameters of the user component are used."
PLG_WTAMOCRMUSERSYNC_ALLOW_UPDATE_USER_DATA = "Allow user data <code>update</code>?"
PLG_WTAMOCRMUSERSYNC_ALLOW_UPDATE_USER_DATA_DESC = "When changing contacts in amoCRM, the data of related users in Joomla will change."
PLG_WTAMOCRMUSERSYNC_UPDATE_USER_EMAIL="<span class=\"badge bg-warning\"><i class=\"fa-solid fa-triangle-exclamation\"></i></span> Change the Joomla user e-mail?"
PLG_WTAMOCRMUSERSYNC_UPDATE_USER_EMAIL_DESC="<p>If so, when changing the associated contact in amoCRM, the main e-mail of the Joomla user will change. <strong>Be careful</strong>, all Joomla emails will be sent to the new email, including password recovery, notifications, etc.</p><p>If amoCRM specifies <strong>multiple e-mails</strong> for a contact, <strong>the first one</strong> will be used.</p>"
PLG_WTAMOCRMUSERSYNC_ALLOW_DELETE_USER_DATA = "Allow users <code>deleting</code>?"
PLG_WTAMOCRMUSERSYNC_ALLOW_DELETE_USER_DATA_DESC = "When deleting a contact in amoCRM, the associated Joomla user will be deleted."
; Creating users fieldset
PLG_WTAMOCRMUSERSYNC_CREATE_USERS_RULES_FIELDSET_LABEL="Users creating"
PLG_WTAMOCRMUSERSYNC_CREATE_USERS_RULES_FIELDSET_DESC="Advanced settings for creating webhook users from amoCRM. Enable the parameter <code>Allow the creation of users?</code> in the <code>amoCRM Webhooks</code> tab."
PLG_WTAMOCRMUSERSYNC_DEFAULT_USER_GROUP="Default user group"
PLG_WTAMOCRMUSERSYNC_DEFAULT_USER_GROUP_DESC="The new users will belong to the selected user group"
PLG_WTAMOCRMUSERSYNC_AUTO_ENABLE_NEW_USER="Auto <code>enable</code> new user?"
PLG_WTAMOCRMUSERSYNC_AUTO_ENABLE_NEW_USER_DESC="<p>The created user will not be blocked and will be able to log into his account on his own.</p><p>When the automatic activation option is enabled, the registration parameters from the <code>Users</code> (<code>com_users</code>) component settings are taken into account. If they include user activation by the administrator or independently, then this setting is overridden by the component parameters. If in the <code> componentUsers</code> the <code> parameter is disabledUser activation</code>, then this setting will be taken into account.</p>"
PLG_WTAMOCRMUSERSYNC_NOTIFY_NEW_USER_NEW_USER="Activation and new user notification"
PLG_WTAMOCRMUSERSYNC_NOTIFY_NEW_USER_DESC="<p>If <code>yes</code>, then the new user will receive a Joomla notification about the created account. He may also need to confirm his e-mail.</p><p>When this parameter is enabled, the registration parameters from the <code>Users</code> (<code>com_users</code>) component settings are taken into account.</p>"
PLG_WTAMOCRMUSERSYNC_WEBHOOK_NOTIFY_AMOCRM_NEW_USER_FROM_WEBHOOK_SUCCESSFULLY_CREATED="User id %s has been successfully created on the %s website."
PLG_WTAMOCRMUSERSYNC_PROCESS_CONTACTS_DUPLICATES="Process contacts duplicates"
PLG_WTAMOCRMUSERSYNC_PROCESS_CONTACTS_DUPLICATES_DESC="<p>In the process of creating Joomla users from amoCRM contacts, a preliminary search for duplicates is performed by <code>e-mail</code>.</p><ul><li>If a Joomla user with this e-mail already exists, but has no connection with the amoCRM contact, the contact will be associated with it.</li><li>If there are several duplicate contacts, the amoCRM contact IDs will be saved to a report file for further manual resolution of the conflict, and only the first amoCRM contact will be associated with the Joomla user.</li></ul>"
PLG_WTAMOCRMUSERSYNC_WEBHOOK_NOTIFY_AMOCRM_NEW_USER_FROM_WEBHOOK_SUCCESSFULLY_LINKED="This contact has been successfully associated with existing user id %s on the %s website."
PLG_WTAMOCRMUSERSYNC_WEBHOOK_NOTIFY_AMOCRM_NEW_USER_FROM_WEBHOOK_DUPLICATES_FOUND="When creating an account on %s website, several different users with the e-mail address specified in this contact were found for the contact: %s. Due to this, it is not possible to link automatically."
PLG_WTAMOCRMUSERSYNC_WEBHOOK_NOTIFY_AMOCRM_NEW_USER_FROM_WEBHOOK_SINGLE_DUPLICATE_PREVIOUS_ASSOCIATION_FOUND="When creating an account on the website %s for the e-mail %s of this contact (id:%s) a previously created user id:%s associated with the amoCRM contact id:%s was found. Due to this, it is not possible to link automatically."
; Fields mapping fieldset
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_FIELDSET_LABEL="Fields mapping (webhook)"
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_FIELDSET_DESC="<p>Configure the mapping of the fields of the amoCRM contact and the Joomla user. You can store field data in the <code>params</code> property of the <code>user</code> object (for developers) or in custom fields.</p><p>These settings are also used by the CLI plugin for importing contacts from amoCRM - <code>Console - WT Import AmoCRM contacts</code>.</p>"
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING="Matching Joomla user and amoCRM contact fields"
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_FIELDS_MAPPING_JOOMLA_FIELD="Storage type"
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_JOOMLA_FIELD_TYPE = "Store data on Joomla side in..."
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_JOOMLA_FIELD_TYPE_DESC="Select the data storage type of the amoCRM contact fields on the Joomla side. This can be the <code>params</code> property of the user object <code>$user</code> (for developers) or the user field of the Users component."
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_FIELDS_MAPPING_JOOMLA_FIELD_CUSTOM_FIELD="Custom field"
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_JOOMLA_FIELD_TYPE_USER_PARAMS="<code>$user[params]</code>"
PLG_WTAMOCRMUSERSYNC_FIELDS_MAPPING_JOOMLA_FIELD_TYPE_USER_CUSTOM_FIELD="custom field"
