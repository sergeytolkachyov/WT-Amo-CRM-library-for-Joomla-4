PKG_LIB_WT_AMOCRM_MAYBE_INTERESTING="<h4>It may be interesting</h4><ul class=\"nav nav-tabs nav-stacked list-group\"><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/web-assets\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">Joomla 4 & Joomla 5 Web Assets.</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/joomshopping\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">JoomShopping extensions</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/joomla-plugins\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">Joomla plugins</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/joomla-modules\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">Joomla modules</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/components\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">Joomla components</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/en/dev/joomla-libraries\" target=\"_blank\" title=\"Go to https://web-tolk.ru\">Joomla libraries for developers.</a></li></ul>"
PKG_LIB_WT_AMOCRM_WHATS_NEW="<h3>v.1.3.0 What's new?</h3><h4>Global library refactoring</h4><p>The library has been completely rewritten. Now it is not a single file, but a developed, extensible flexible system. Because backward compatibility is not broken - the library version is 1.3.0.</p><h4>Joomla 6</h4><p>The library has been successfully tested on Joomla 6-beta2.</p><h4>Increased coverage of amoCRM REST API methods</h4><p>Currently, the library supports working with: contacts, custom fields, leads, notes, tags, amoCRM contacts, webhooks, account information.</p><h4>Long-term tokens</h4><p>Added support for long-term amoCRM tokens when configuring the library.</p><h4>User synchronization</h4><p>Added a plugin for syncing Joomla users and amoCRM contacts. The plugin allows you to both create new contacts in amoCRM when creating/registering users in Joomla, and create Joomla users when creating amoCRM contacts. It is possible to update information in one system when data changes in another.</p><p>When working with data, you can use custom Joomla fields and configure the mapping of amoCRM contact fields and Joomla fields to update/fill in data with incoming webhook. Data can also be stored in the <code>params</code> property of the user object (<code>$user[\"params\"]</code>).</p><h4>User import plugin CLI</h4><p>A plugin for importing users from amoCRM via the REST API has been added. amoCRM has data export in CSV format. However, perhaps due to the large number of different integrations, the data is not always exported correctly. In order to avoid problems with data structure violations, it was decided to import data more slowly directly via the REST API. The commands to execute in the server console can be found in the plugin parameters of the <code>console</code> group.</p><h4>For developers: processing incoming webhooks</h4><p>The system plugin adds a single entry point for webhooks from amoCRM. In the future, information from the webhook is transmitted to the plugins of the <code>system</code>, <code>user</code> and <code>amocrm</code> groups that trigger the <code>onAmocrmIncomingWebhook</code> event.</p><h4>For developers: the amocrm plugin group</h4><p>To ensure that flexible and complex integrations do not affect the speed of the site, a specialized plugin group has been added - <code>amocrm</code>. You can create your own plugin for this group and work with amoCRM data without affecting the rest of the Joomla sections.</p><h4>For developers: a collection of Joomla Form fields</h4><p>A collection of Joomla Form fields has been created for use in Joomla extensions. These fields are used in the plugins of the library itself, but developers can use ready-made fields in third-party extensions.</p><p>List of fields: account information, list of tags (companies, leads, contacts), list of piplines, contact information, list of custom fields (companies, contacts), list of webhooks created in amoCRM, modal entity selection window (<code>ModalSelect</code> field, leads and contacts).</p><p>The fields are implemented using <code>layouts</code> Joomla. If absolutely necessary, you can redefine the field output layout using standard Joomla tools.</p>"
