PKG_LIB_WT_AMOCRM_MAYBE_INTERESTING="<h4>Может быть интересно</h4><ul class=\"nav nav-tabs nav-stacked list-group\"><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/web-assets\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Joomla 4 & Joomla 5 Web Assets</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomshopping\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Расширения для JoomShopping</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-plugins\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Плагины Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/joomla-modules\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Модули Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/components\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Компоненты Joomla</a></li><li class=\"list-group-item\"><a href=\"https://web-tolk.ru/dev/biblioteki\" target=\"_blank\" title=\"Перейти на https://web-tolk.ru\">Библиотеки Joomla для разработчиков</a></li></ul>"
PKG_LIB_WT_AMOCRM_WHATS_NEW="<h3>v.1.3.1 Что нового?</h3><h4>Глобальный рефакторинг библиотеки</h4><p>Библиотека полностью переписана. Теперь это не один файл, а развитая, расширяемая гибкая система. Поскольку обратная совместимость не нарушена - версия библиотеки 1.3.0.</p><h4>Joomla 6</h4><p>Библиотека успешно протестирована на Joomla 6-beta2.</p><h4>Увеличено покрытие методов REST API AmoCRM</h4><p>На данный момент библиотека поддерживает работу с: контактами, пользовательскими полями, сделками, заметками, тегами, пользователями AmoCRM, вебхуками, информацией об аккаунте.</p><h4>Долгосрочные токены</h4><p>Добавлена поддержка долгосрочных токенов AmoCRM при настройке библиотеки.</p><h4>Синхронизация пользователей</h4><p>Добавлен плагин синхронизации пользователей Joomla и контактов AmoCRM. Плагин позволяет как создавать новые контакты в AmoCRM при создании / регистрации пользователей в Joomla, так и создавать пользователей Joomla при создании контактов AmoCRM. Возможно обновлять информацию в одной системе при изменении данных в другой.</p><p>При работе с данными можно использовать пользовательские поля Joomla и настроить сопоставление полей контакта AmoCRM и полей Joomla для обновления/заполнения данными при входящем вебхуке. Данные также можно хранить в свойстве <code>params</code> объекта пользователя (<code>$user[\"params\"]</code>).</p><p>При различных действиях с пользователями в контакт AmoCRM будет отправляется комментарий/уведомление о происходящих действиях: найденных дублях, созданных ассоциациях, возникших ошибках и т.д.</p><h4>CLI плагин импорта пользователей</h4><p>Добавлен плагин импорта пользователей из AmoCRM по REST API. В AmoCRM есть экспорт данных в CSV. Однако, возможно из-за большого количества разного рода интеграций, данные не всегда корректно экспортируются. Дабы избежать проблем с нарушением структуры данных было принято решение сделать более медленный импорт данных напрямую по REST API. Команды для выполнения в консоли сервера можно увидеть в параметрах плагина группы <code>console</code>.</p><h4>Для разработчиков: обработка входящих вебхуков</h4><p>В системном плагине добавлена единая точка входа для вебхуков со стороны AmoCRM. В дальнейшем информация из вебхука передаётся плагинам групп <code>system</code>, <code>user</code> и <code>amocrm</code>, срабатывающим на событие <code>onAmocrmIncomingWebhook</code>.</p><h4>Для разработчиков: группа плагинов amocrm</h4><p>Чтобы гибкие и сложные интеграции не влияли скорость работы сайта - добавлена специализированная группа для плагинов - <code>amocrm</code>. Вы можете создать собственный плагин этой группы и работать с данными AmoCRM не затрагивая остальные разделы Joomla.</p><h4>Для разработчиков: коллекция полей Joomla Form</h4><p>Для использования в расширениях Joomla создана коллекция полей Joomla Form. Эти поля используются в плагинах самой библиотеки, однако разработчики могут использовать готовые поля и в сторонних расширениях.</p><p>Список полей: информация об аккаунте, список тегов (компании, сделки, контакты), список воронок, информация о контакте, список пользовательских полей (компании, контакты), список созданных в AmoCRM вебхуков, модальное окно выбора сущности (поле <code>ModalSelect</code>, сделки и контакты).</p><p>Поля реализованы с использванием <code>layouts</code> Joomla. При острой необходимости вы можете переопределить макет вывода поля штатными средствами Joomla.</p><h4>v.1.3.1</h4><p>Исправлена ошибка обновления полей AmoCRM контакта при сохранении пользователя через фронтенд форму.</p>"
