PLG_WT_AMOCRM="System - WT Amo CRM Library"
PLG_WT_AMOCRM_DESC="WT Amo CRM library configuration plugin for Joomla"
PLG_WT_AMOCRM_AMOCRM_DOMAIN="Amo CRM domain"
PLG_WT_AMOCRM_AMOCRM_DOMAIN_DESC="Your Amo CRM domain of the type <code>mydomain.amocrm.ru </code>, without <code>https://</code> and the slash character <code>/</code> at the end."
PLG_WT_AMOCRM_AMOCRM_DOMAIN_HINT="mydomain.amocrm.ru or mydomain.kommo.com"
PLG_WT_AMOCRM_AMOCRM_CLIENT_ID="ID integration in Amo CRM"
PLG_WT_AMOCRM_AMOCRM_CLIENT_ID_DESC="Integration ID in Amo CRM (aka OAuth Client id). Can be found in <code>amoMarket - installed - Your integration for the site - Keys and accesses</code>"
PLG_WT_AMOCRM_AMOCRM_CLIENT_SECRET="Secret key"
PLG_WT_AMOCRM_AMOCRM_CLIENT_SECRET_DESC="Integration Secret key (OAuth client secret). Can be found in <code>amoMarket - installed - Your integration for the site - Keys and accesses</code>"
PLG_WT_AMOCRM_AMOCRM_TOKEN_TYPE="Token type"
PLG_WT_AMOCRM_AMOCRM_TOKEN_TYPE_DESC="The <strong>regular token</strong> is updated once a day using the <strong>Refresh token</strong>, which, in turn, is updated once every 3 months. If the integration has not been used for 3 months, it needs to be recreated on the AmoCRM side. <strong>The long-term token</strong> has an expiration date, but does not require regular renewal. <a href=\"https://www.amocrm.ru/developers/content/oauth/step-by-step\" target=\"_blank\">For more information, see the AmoCRM documentation</a>"
PLG_WT_AMOCRM_AMOCRM_TOKEN_TYPE_NORMAL="Regular"
PLG_WT_AMOCRM_AMOCRM_TOKEN_TYPE_LONG_TERM="Long-term"
PLG_WT_AMOCRM_AMOCRM_LONG_TERM_TOKEN="Long-term token"
PLG_WT_AMOCRM_AMOCRM_LONG_TERM_TOKEN_DESC="You can generate a long-term token when creating an external integration in amoCRM. Specify the expiration date of the token."
PLG_WT_AMOCRM_AMOCRM_CODE="Authorization code (valid for 20 minutes)"
PLG_WT_AMOCRM_AMOCRM_CODE_DESC="The authorization code is a temporary key that is valid for only 20 minutes. With its help, you need to get a refresh token and an access token during this time (<strong> that is, make the plugin settings in Joomla and click the </strong> button <span class=\"badge bg-success\">save</span>). It is temporary, because it can be intercepted, but in case of interception, an attacker will not be able to do anything with it unless you tell him the application keys known only to the administrators of the account in which the integration was created."
PLG_WT_AMOCRM_AMOCRM_REDIRECT_URI="Redirect URL"
PLG_WT_AMOCRM_AMOCRM_REDIRECT_URI_DESC="It must be specified in the integration settings on the Amo CRM side."
PLG_WT_AMOCRM_CLEAR_REFRESH_TOKEN_BTN="Delete <code>refresh token</code> from the database"
PLG_WT_AMOCRM_CLEAR_REFRESH_TOKEN_BTN_DESC="<p>You should use this button only if your refresh token has expired and you need to remove it from the library settings.</p><p>Amo CRM issues an access token for one day. To get a new token, a refresh token is used. <strong class=\"text-danger\">Refresh token is valid for only 3 months</strong>. If the integration has not been used for 3 months, there has not been a single request to update the key, then the integration will lose access to the data and we will need to re-create and configure the integration. <a href=\"https://www.amocrm.ru/developers/content/oauth/step-by-step\" trarget=\"_blank\">For more information, see the Amo CRM documentation</a></p>"
PLG_WT_AMOCRM_CLEAR_REFRESH_TOKEN_DATE="Refresh token date"
PLG_WT_AMOCRM_CLEAR_REFRESH_TOKEN_BTN_LABEL="Clear"
PLG_WT_AMOCRM_AVOID_REST_API_LIMITS_EXCEEDING="Avoid exceeding the limits of access to the REST API?"
PLG_WT_AMOCRM_AVOID_REST_API_LIMITS_EXCEEDING_DESC="<p>The amoCRM REST API has mechanisms for limiting API activity – no <strong class=\"text-danger\">more than 7 requests per second</strong>. If the number of requests is exceeded, the HTTP code 429 will be returned. If the restrictions are repeatedly violated, the <strong>account will be blocked</strong> and the HTTP code <code>403</code> will be returned to any API request. <a href=\"https://www.amocrm.ru/developers/content/api/recommendations\" target=\"_blank\">For more information, see the documentation</a>.</p><p>Enabling this option will artificially slow down the execution of requests to the REST API by adding a pause of 150 milliseconds between their executions. This is guaranteed to perform no more than 7 requests per second when running 1 script.</p>"

PLG_WT_AMOCRM_WEBHOOK_FIELDSET_LABEL="AmoCRM Webhooks"
PLG_WT_AMOCRM_ALLOW_AMOCRM_WEBHOOKS="Allow incoming amoCRM webhooks?"
PLG_WT_AMOCRM_ALLOW_AMOCRM_WEBHOOKS_DESC="If yes, you will be able to use the data creation and management capabilities in Joomla during various events in amoCRM"

PLG_WT_AMOCRM_WEBHOOK_TOKEN="Webhook token"
PLG_WT_AMOCRM_FIELD_WEBHOOK_TOKEN_TOKEN_IS_EMPTY="The token has not been created. Create a new token manually or clear the field and save the plugin settings. The token will be generated automatically. After that, save the plugin settings again."
PLG_WT_AMOCRM_FIELD_WEBHOOK_TOKEN_TOKEN_IS_CREATED="The token is saved. To create a new token, change it manually or clear the field and save the plugin settings twice."
PLG_WT_AMOCRM_FIELD_WEBHOOK_URL="Webhook URL"
PLG_WT_AMOCRM_FIELD_WEBHOOK_URL_EMPTY_WEBHOOK_TOKEN_DESC="Create a token and save the plugin parameters. If you leave the token field empty, it will be generated automatically."
PLG_WT_AMOCRM_FIELD_WEBHOOKS_LIST="Webhook list"