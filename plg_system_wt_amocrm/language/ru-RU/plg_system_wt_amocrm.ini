PLG_WT_AMOCRM_AMOCRM_TOKEN_TYPE="Тип токена"
PLG_WT_AMOCRM_AMOCRM_TOKEN_TYPE_DESC="<strong>Обычный токен</strong> обновляется раз в сутки с помощью <strong>Refresh token</strong>, который, в свою очередь, обновляется раз в 3 месяца. Если интеграция не использовалась в течение 3-х месяцев - её нужно пересоздавать на стороне AmoCRM. <strong>Долгосрочный токен</strong> имеет дату окончания действия, но не требует регулярного продления. <a href=\"https://www.amocrm.ru/developers/content/oauth/step-by-step\" target=\"_blank\">Подробнее в документации AmoCRM</a>"
