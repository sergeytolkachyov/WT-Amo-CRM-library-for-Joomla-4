PLG_WT_AMOCRM_AMOCRM_CODE = "Код авторизации (действителен 20 минут)"
PLG_WT_AMOCRM_AMOCRM_CODE_DESC = "Код авторизации является временным ключом, который действует только 20 минут. C его помощью вам необходимо в течении этого времени получить refresh token и access токен (<strong>то есть сделать настройки плагина в Joomla и нажать кнопку</strong> <span class=\"badge bg-success\">сохранить</span>). Он является временным, т.к. может быть перехвачен, но в случае перехвата злоумышленник не сможет с ним ничего сделать, если вы не сообщите ему ключи приложения, известные только администраторам аккаунта, в котором создана интеграция."
PLG_WT_AMOCRM_AMOCRM_REDIRECT_URI = "Ссылка для перенаправления (Redirect URL)"
PLG_WT_AMOCRM_AMOCRM_REDIRECT_URI_DESC = "Его нужно указать в настройках интеграции на стороне Amo CRM."
PLG_WT_AMOCRM_CLEAR_REFRESH_TOKEN_BTN = "Удалить <code>refresh token</code> из базы данных"
PLG_WT_AMOCRM_CLEAR_REFRESH_TOKEN_BTN_DESC = "<p>Вы должны использовать эту кнопку только в том случае, если срок действия вашего refresh токена истек и вам необходимо удалить его из настроек библиотеки.</p><p>Amo CRM выдаёт access-токен на одни сутки. Для получения нового токена используется refresh-токен. <strong class=\"text-danger\">Refresh токен действует всего 3 месяца</strong>. Если интеграция не используется в течение 3 месяцев, не было ни одного запроса на актуализацию ключа, то интеграция потеряет доступ к данным и будем необходимо повторно создавать и настраивать интеграцию. <a href=\"https://www.amocrm.ru/developers/content/oauth/step-by-step\" trarget=\"_blank\">Подробнее в документации Amo CRM</a></p>"
PLG_WT_AMOCRM_CLEAR_REFRESH_TOKEN_DATE = "Дата получения refresh token"
PLG_WT_AMOCRM_CLEAR_REFRESH_TOKEN_BTN_LABEL= "Очистить"
PLG_WT_AMOCRM_AVOID_REST_API_LIMITS_EXCEEDING="Избегать превышения лимитов обращений к REST API?"
PLG_WT_AMOCRM_AVOID_REST_API_LIMITS_EXCEEDING_DESC="<p>REST API AmoCRM имеет механизмы ограничения активности работы с API – <strong class=\"text-danger\">не более 7 запросов в секунду</strong>. В случае превышения количества запросов – будет возвращаться HTTP код 429, при многократном нарушении ограничений, <strong>аккаунт блокируется</strong> и на любой запрос в API будет возвращаться HTTP код <code>403</code>. <a href=\"https://www.amocrm.ru/developers/content/api/recommendations\" target=\"_blank\">Подробнее в документации</a>.</p><p>Включение данного параметра искусственно замедлит выполнение запросов к REST API, добавив паузу в 150 миллисекунд между их выполненями. Это позволит гарантировано выполнять не более 7 запросов в секунду при работе 1 скрипта.</p>"


